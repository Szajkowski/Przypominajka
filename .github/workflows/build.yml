name: Build and Publish Release Executables

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build Executable on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset_name: Przypominajka-windows.exe
            executable_path: dist/Przypominajka-windows.exe
          - os: ubuntu-latest
            asset_name: Przypominajka-linux
            executable_path: dist/Przypominajka-linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --name ${{ matrix.asset_name }} Przypominajka.py

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.executable_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
